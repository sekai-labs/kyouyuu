storage:
  type: SQLITE
  autosave-interval-seconds: 30
  mysql:
    host: "localhost"
    port: 3306
    database: "kyouyuu"
    username: "root"
    password: ""
    ssl: false
  postgresql:
    host: "localhost"
    port: 5432
    database: "kyouyuu"
    username: "postgres"
    password: ""
    ssl: false
linking:
  session-timeout-seconds: 30
hopper:
  enabled: true
messages:
  prefix: "<aqua>[Kyouyuu]</aqua> "
  no-permission: "<red>You do not have permission to do that.</red>"
  channel-created: "<green>Channel <yellow><id></yellow> created successfully with <slots> slots.</green>"
  channel-deleted: "<green>Channel <yellow><id></yellow> deleted successfully.</green>"
  chest-linked: "<green>Chest linked to channel <yellow><id></yellow>.</green>"
  chest-unlinked: "<green>Chest unlinked from channel.</green>"
  link-mode-active: "<green>Linking mode active for channel <yellow><id></yellow>. Right-click any chest or barrel to link (30s timeout).</green>"
  unlink-mode-active: "<green>Unlink mode active. Right-click any linked chest or barrel to unlink (30s timeout).</green>"
